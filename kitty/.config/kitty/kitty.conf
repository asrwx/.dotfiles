# font
font_family JetBrains Mono Nerd Font
# font_family VictorMono Nerd Font
# font_family FiraCode Nerd Font Mono
# font_family Hack
# font_family Maple Mono NF
# font_family CaskaydiaMono Nerd Font Mono
# font_family MesloLGS Nerd Font Mono
# font_family Iosevka NFM
# font_family BlexMono Nerd Font Mono
# disable_ligatures always
font_size 11
# bold_font auto
italic_font auto
bold_italic_font auto

# cursor
cursor_shape beam
# cursor_trail 1
cursor_blink_interval 0

# background_opacity 0.85
# background #080c10
# background #090909
# dynamic_background_opacity yes
background_blur 1

cursor_shape block
shell_integration no-cursor

# shell /bin/zsh

url_style curly
remember_window_size no
# initial_window_width 640
# initial_window_height 480
# sync_to_monitor no
# scrollbar_handle_opacity 0.5
# scrollbar_track_opacity 0.1
# scrollbar_track_hover_opacity 0

# BEGIN_KITTY_THEME
# Gruvbox Material Dark Medium
include current-theme.conf
# END_KITTY_THEME

map ctrl+backspace send_text all \x17

# Tab navigation — Vim-style
map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab

# Move the current tab
map ctrl+shift+j move_tab_forward
map ctrl+shift+k move_tab_backward

# Window navigation
map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window bottom
map ctrl+alt+k neighboring_window top
map ctrl+alt+l neighboring_window right
